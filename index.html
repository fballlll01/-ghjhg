<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Shelf</title>
<style>
:root{--bg:#1f1f23;--panel:#2a2a30;--line:#3b3b44;--text:#f2f2f4;--dim:#a0a0ab;--accent:#fa5c5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 20px;background:#18181b;border-bottom:1px solid var(--line)}
#brand{margin:0 auto 0 0;font-size:19px;font-weight:700}
#brand span{color:var(--accent)}
button,input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 14px}
button{cursor:pointer}
button:hover,button:focus-visible,input:focus{border-color:var(--accent);outline:none}
button.go,button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{display:block;width:100%;padding:0;overflow:hidden;text-align:left}
.thumb{aspect-ratio:16/10;display:grid;place-items:center;font-size:42px;font-weight:800;color:#ffffffcc}
.meta{display:block;padding:10px 12px}
.meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta small,.dim{color:var(--dim)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar h2{margin:0;flex:1;font-size:20px}
.stage{width:100%;height:calc(100vh - 150px);min-height:360px;background:#000;border-radius:4px;overflow:hidden}
.stage iframe{display:block;width:100%;height:100%;border:0}
.msg{padding:20px 24px;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:4px}
.msg.err{border-color:var(--accent)}
.msg h3{margin:0 0 6px}
code{background:#111;padding:1px 6px;border-radius:3px}
.acc{margin:0 0 14px;padding:8px 16px 14px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.acc legend{padding:0 6px;font-weight:600}
.acc label{display:block;margin-top:8px;color:var(--dim);font-size:13px}
.acc input{display:block;width:100%;margin-top:2px;background:#18181b}
.acc button{margin-top:12px}
</style>
</head>
<body>
<header><h1 id="brand"></h1><button data-t="#/">Games</button><button data-t="#/art">Claude artifacts</button><button data-t="#/settings">Settings</button><button id="refresh">Refresh list</button></header>
<main id="app"></main>
<script>
// Optional defaults: Render fills these in from its Environment settings and they become the "Main" account.
// More accounts and folders are added in Settings and saved in this browser.
const CONFIG = {
  title: "Game Shelf",
  apiKey: "PASTE_YOUR_GOOGLE_API_KEY",
  folderId: "PASTE_YOUR_DRIVE_FOLDER_ID"
};

const $ = s => document.querySelector(s), app = $('#app');
const API = 'https://www.googleapis.com/drive/v3/files', STORE = 'gameshelf:v2';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const pretty = n => n.replace(/\.(html?|jsx)$/i, '').replace(/[_-]+/g, ' ').trim();
const hue = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 0);
const box = (h, p, c = '') => `<div class="msg ${c}"><h3>${h}</h3><p>${p}</p></div>`;
const note = (h, p) => app.innerHTML = box(h, p);
const idOf = s => ((s || '').match(/folders\/([\w-]+)/) || [])[1] || (s || '').trim();
const EXT = { g: /\.html?$/i, a: /\.(jsx|html?)$/i }, FIELD = { g: 'games', a: 'art' }, TAB = { g: '#/', a: '#/art', s: '#/settings' };
let lists = {}, blobUrl, accts;
try { accts = JSON.parse(localStorage.getItem(STORE)) } catch {}
if (!Array.isArray(accts)) accts = CONFIG.apiKey.includes('PASTE') || CONFIG.folderId.includes('PASTE') ? [] : [{ id: 'main', name: 'Main', apiKey: CONFIG.apiKey, games: CONFIG.folderId, art: '' }];
const persist = () => { localStorage.setItem(STORE, JSON.stringify(accts)); lists = {} };

document.title = CONFIG.title;
$('#brand').innerHTML = '<a href="#/" style="color:inherit;text-decoration:none"><span>▶</span> ' + esc(CONFIG.title) + '</a>';
document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => location.hash = b.dataset.t);
$('#refresh').onclick = async () => { await ensure(location.hash === '#/art' ? 'a' : 'g', true); route() };
addEventListener('hashchange', route);

async function drive(a, url) {
  const r = await fetch(url + '&key=' + encodeURIComponent(a.apiKey));
  if (r.ok) return r;
  let d = ''; try { d = (await r.json()).error.message } catch {}
  const tip = {
    400: 'Check the API key.',
    403: 'Check that the Drive API is enabled and the key allows this site.',
    404: 'Check that the folder or file is shared as "Anyone with the link".'
  }[r.status] || '';
  throw new Error(`Google Drive replied ${r.status}. ${d} ${tip}`);
}

async function ensure(s, force) {
  if (!force && lists[s]) return;
  note('Loading', 'Fetching files from Google Drive…');
  const out = [], errs = [], k = FIELD[s];
  await Promise.all(accts.filter(a => a.apiKey && a[k]).map(async a => {
    try {
      const q = encodeURIComponent(`'${a[k]}' in parents and trashed=false`);
      const r = await drive(a, `${API}?q=${q}&orderBy=name&pageSize=200&fields=files(id,name,mimeType,modifiedTime)`);
      (await r.json()).files.filter(f => EXT[s].test(f.name) || f.mimeType === 'text/html').forEach(f => out.push({ ...f, a }));
    } catch (e) { errs.push(esc(a.name + ': ' + e.message)) }
  }));
  lists[s] = { out: out.sort((x, y) => x.name.localeCompare(y.name)), errs };
}

async function route() {
  const h = location.hash, m = h.match(/^#\/([ga])\/(\w+)\/([\w-]+)$/), s = m ? m[1] : h === '#/settings' ? 's' : h === '#/art' ? 'a' : 'g';
  document.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === TAB[s]));
  $('#refresh').hidden = !!m || s === 's';
  if (s === 's') return settings();
  await ensure(s);
  if (location.hash !== h) return;
  m ? play(s, m[3]) : library(s);
}

function library(s) {
  const { out, errs } = lists[s], e = errs.map(x => box('Could not read a folder', x, 'err')).join('');
  if (!out.length) return app.innerHTML = e + (accts.length
    ? box(s === 'a' ? 'No artifacts yet' : 'No games yet', s === 'a'
      ? 'Add a Claude artifacts folder to an account in <a href="#/settings">Settings</a>, then put <code>.jsx</code> or <code>.html</code> artifacts in it.'
      : 'Put <code>.html</code> files in your Drive folder, then press Refresh list.')
    : box('Add an account', 'Open <a href="#/settings">Settings</a> and add your Google API key and Drive folder.'));
  app.innerHTML = e + '<div class="grid">' + out.map(g => {
    const t = pretty(g.name), ini = t.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
    return `<button class="card" data-h="#/${s}/${esc(g.a.id)}/${esc(g.id)}"><span class="thumb" style="background:hsl(${hue(g.id)} 45% 30%)">${esc(ini)}</span><span class="meta"><b>${esc(t)}</b><small>${esc(g.a.name)} · ${/\.jsx$/i.test(g.name) ? 'React · ' : ''}${new Date(g.modifiedTime).toLocaleDateString()}</small></span></button>`;
  }).join('') + '</div>';
  app.querySelectorAll('.card').forEach(c => c.onclick = () => location.hash = c.dataset.h);
}

function collect() {
  document.querySelectorAll('.acc').forEach(f => {
    const a = accts.find(x => x.id === f.dataset.id), v = k => f.querySelector(`[data-f=${k}]`).value;
    if (a) Object.assign(a, { name: v('name').trim() || 'Account', apiKey: v('apiKey').trim(), games: idOf(v('games')), art: idOf(v('art')) });
  });
}

function settings() {
  const row = a => `<fieldset class="acc" data-id="${esc(a.id)}"><legend>${esc(a.name)}</legend>
<label>Name<input data-f="name" value="${esc(a.name)}"></label>
<label>Google API key<input data-f="apiKey" value="${esc(a.apiKey)}" autocomplete="off" spellcheck="false"></label>
<label>Games folder (ID or link)<input data-f="games" value="${esc(a.games)}" autocomplete="off"></label>
<label>Claude artifacts folder (ID or link, optional)<input data-f="art" value="${esc(a.art)}" autocomplete="off"></label>
<button data-rm="${esc(a.id)}">Remove account</button></fieldset>`;
  app.innerHTML = `<div class="bar"><h2>Settings</h2></div><p class="dim">Each account is a Google Drive folder (or two) the shelf reads from. Share the folders as "Anyone with the link". Settings are saved in this browser only.</p>${accts.map(row).join('')}<div class="bar"><button id="add">Add account</button><button class="go" id="save">Save</button><span class="dim" id="ok"></span></div>`;
  $('#add').onclick = () => { collect(); accts.push({ id: 'a' + Math.random().toString(36).slice(2, 8), name: 'Account ' + (accts.length + 1), apiKey: accts[0]?.apiKey || '', games: '', art: '' }); persist(); settings() };
  $('#save').onclick = () => { collect(); persist(); $('#ok').textContent = 'Saved' };
  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { collect(); accts = accts.filter(a => a.id !== b.dataset.rm); persist(); settings() });
}

async function play(s, id) {
  const g = lists[s].out.find(x => x.id === id);
  if (!g) { location.hash = TAB[s]; return }
  app.innerHTML = `<div class="bar"><button id="back">Back to library</button><h2>${esc(pretty(g.name))}</h2><button id="again">Restart</button><button class="go" id="full">Fullscreen</button></div><div class="stage" id="stage"><p class="dim" style="padding:20px">Loading…</p></div>`;
  $('#back').onclick = () => location.hash = TAB[s];
  try {
    const raw = await (await drive(g.a, `${API}/${id}?alt=media`)).text();
    if (!location.hash.endsWith(id)) return;
    const html = wrap(/\.jsx$/i.test(g.name) ? artifact(raw) : raw, id);
    const start = () => {
      URL.revokeObjectURL(blobUrl);
      blobUrl = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
      const f = document.createElement('iframe');
      f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-forms allow-modals allow-downloads');
      f.allow = 'fullscreen; autoplay; gamepad; clipboard-write';
      f.title = g.name;
      f.onload = () => f.contentWindow.focus();
      f.src = blobUrl;
      $('#stage').replaceChildren(f);
    };
    $('#again').onclick = start;
    $('#full').onclick = () => $('#stage').requestFullscreen?.();
    start();
  } catch (e) { if (location.hash.endsWith(id)) note('Could not load this', esc(e.message)) }
}

// React (.jsx) Claude artifacts: Babel compiles the file in the page, and an import map
// supplies React and the usual artifact libraries from esm.sh. Tailwind comes from its CDN.
const E = 'https://esm.sh/', XR = '?external=react', X = '?external=react,react-dom';
const IMPORTS = JSON.stringify({ imports: {
  'react': E + 'react@18.3.1', 'react/jsx-runtime': E + 'react@18.3.1/jsx-runtime',
  'react-dom': E + 'react-dom@18.3.1' + XR, 'react-dom/client': E + 'react-dom@18.3.1/client' + XR,
  'lucide-react': E + 'lucide-react@0.383.0' + X, 'recharts': E + 'recharts@2.12.7' + X,
  'lodash': E + 'lodash@4.17.21', 'd3': E + 'd3@7.9.0', 'three': E + 'three@0.128.0',
  'mathjs': E + 'mathjs@13.2.0', 'papaparse': E + 'papaparse@5.4.1', 'chart.js': E + 'chart.js@4.4.3' } });

function artifact(src) {
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body,#root{height:100%;margin:0}html{background:#fff;color:#111}</style>
<script src="https://cdn.tailwindcss.com/3.4.17"><\/script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"><\/script>
<script type="importmap">${IMPORTS}<\/script></head>
<body><div id="root"></div><script type="module">
import { createRoot } from 'react-dom/client';
import { jsx } from 'react/jsx-runtime';
const root = document.getElementById('root');
try {
  const js = Babel.transform(${JSON.stringify(src).replace(/</g, '\\u003c')}, { presets: [['react', { runtime: 'automatic' }]], filename: 'artifact.jsx' }).code;
  const m = await import(URL.createObjectURL(new Blob([js], { type: 'text/javascript' })));
  if (!m.default) throw new Error('No default export found. The artifact needs export default App.');
  createRoot(root).render(jsx(m.default, {}));
} catch (e) { root.innerHTML = '<pre style="color:#b00;padding:16px;white-space:pre-wrap"></pre>'; root.firstChild.textContent = String(e.stack || e) }
<\/script></body></html>`;
}

// Gives every game its own private localStorage namespace, so saves from different games never
// overwrite each other, and adds the artifact window.storage API on top of that namespace.
function wrap(html, id) {
  const shim = `<script>try{(()=>{const P=${JSON.stringify('gs:' + id + ':')},S=localStorage,
ks=()=>{const o=[];for(let i=0;i<S.length;i++){const k=S.key(i);if(k.startsWith(P))o.push(k.slice(P.length))}return o},
m={getItem:k=>S.getItem(P+k),setItem:(k,v)=>S.setItem(P+k,v),removeItem:k=>S.removeItem(P+k),clear:()=>ks().forEach(k=>S.removeItem(P+k)),key:i=>ks()[i]??null};
Object.defineProperty(window,'localStorage',{configurable:true,value:new Proxy({},{
get:(_,k)=>k==='length'?ks().length:k in m?m[k]:S.getItem(P+String(k))??undefined,
set:(_,k,v)=>(S.setItem(P+k,v),true),
deleteProperty:(_,k)=>(S.removeItem(P+k),true),
has:(_,k)=>S.getItem(P+String(k))!==null,
ownKeys:ks,
getOwnPropertyDescriptor:(_,k)=>{const v=S.getItem(P+String(k));return v===null?undefined:{value:v,enumerable:true,configurable:true,writable:true}}})})})()}catch(e){}<\/script>`;
  const st = `<script>try{const L=localStorage;window.storage={get:async k=>{const v=L.getItem('st:'+k);if(v===null)throw new Error('Key not found: '+k);return{key:k,value:v,shared:false}},set:async(k,v)=>(L.setItem('st:'+k,v),{key:k,value:v,shared:false}),delete:async k=>(L.removeItem('st:'+k),{key:k,deleted:true,shared:false}),list:async(p='')=>{const o=[];for(let i=0;i<L.length;i++){const k=L.key(i);if(k.startsWith('st:'+p))o.push(k.slice(3))}return{keys:o,prefix:p,shared:false}}}}catch(e){}<\/script>`;
  const head = /<head(\s[^>]*)?>/i;
  return head.test(html) ? html.replace(head, m => m + shim + st) : '<!DOCTYPE html>' + shim + st + html;
}

route();
</script>
</body>
</html>
